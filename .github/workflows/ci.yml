name: ci

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -m:2
      # MTP mode: `dotnet test -m:2` silently runs zero tests (docs/DECISIONS.md);
      # sample-map tests self-skip when GBX_SIZE_TREE_SAMPLE is absent.
      - run: dotnet test --no-build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/GbxSizeTree -m:2 -c Release -r linux-x64 -o artifacts/linux-x64
      - run: dotnet publish src/GbxSizeTree -m:2 -c Release -r win-x64 -o artifacts/win-x64
      - name: Package release zips
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts/release/stage
          cp LICENSE THIRD-PARTY-NOTICES.md README.md artifacts/release/stage/
          cp artifacts/linux-x64/gbx-size-tree artifacts/release/stage/
          (cd artifacts/release/stage && zip -q "../gbx-size-tree-${version}-linux-x64.zip" gbx-size-tree LICENSE THIRD-PARTY-NOTICES.md README.md)
          rm artifacts/release/stage/gbx-size-tree
          cp artifacts/win-x64/gbx-size-tree.exe artifacts/release/stage/
          (cd artifacts/release/stage && zip -q "../gbx-size-tree-${version}-win-x64.zip" gbx-size-tree.exe LICENSE THIRD-PARTY-NOTICES.md README.md)
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/release/*.zip
          draft: true
