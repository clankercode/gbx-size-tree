name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -m:2
      # MTP mode: `dotnet test -m:2` silently runs zero tests (docs/DECISIONS.md);
      # sample-map tests self-skip when GBX_SIZE_TREE_SAMPLE is absent.
      - run: dotnet test --no-build
